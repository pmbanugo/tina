name: Test Architecture Hygiene

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/test_architecture_hygiene.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/test_architecture_hygiene.yml"
      - ".github/workflows/ci.yml"

jobs:
  hygiene:
    name: Test architecture hygiene (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-06
      - name: Self-test hygiene tool
        run: odin run scripts/check_test_hygiene.odin -file -strict-style -- --self-test
      - name: Run hygiene checks
        run: odin run scripts/check_test_hygiene.odin -file -strict-style
